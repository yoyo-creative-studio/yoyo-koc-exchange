<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator Portal Mobile Preview</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#080a10;color:#f5f7fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh;padding:24px;background:radial-gradient(circle at 50% 0,rgba(102,87,180,.22),transparent 38%),#080a10}
    .preview{width:390px;max-width:100%;height:min(844px,calc(100vh - 48px));min-height:620px;overflow:hidden;background:#0b0d14;border:1px solid rgba(255,255,255,.18);border-radius:28px;box-shadow:0 28px 90px rgba(0,0,0,.55),0 0 0 7px #171a24}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b0d14}
    @media(max-width:470px){body{display:block;padding:0}.preview{width:100%;height:100vh;min-height:100vh;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <main class="preview" aria-label="Creator Portal mobile preview">
    <iframe title="Logged-in Creator Portal mobile preview" src="index.html?preview=dashboard&amp;preview-tab=redeem&amp;design-preview=seraphina"></iframe>
  </main>
</body>
</html>
